name: CI - Phonebook

on:
  push:
    branches: [main, feat/phonebook-web-ui]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: phonebook-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run all Java tests and build JAR
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify
      - name: Check frontend JavaScript syntax
        run: node --check src/main/resources/static/assets/phonebook.js
      - name: Validate static frontend contract
        run: node --test tests/frontend.test.cjs
      - name: Upload test reports (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image (tests run in build stage)
        run: docker build -t phonebook:ci .

  smoke:
    name: PostgreSQL + Chromium end-to-end
    runs-on: ubuntu-latest
    needs: [test, docker]
    timeout-minutes: 20
    env:
      POSTGRES_DB: phonebook
      POSTGRES_USER: phonebook
      POSTGRES_PASSWORD: ci-test-only-not-production
      JWT_SECRET: ci-test-only-secret-32-characters-minimum-0123456789
      JWT_EXPIRATION: '3600000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start PostgreSQL and application
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do
            if curl --silent --fail http://localhost:8080/actuator/health; then
              echo "Application healthy"
              exit 0
            fi
            sleep 3
          done
          docker compose logs --no-color
          exit 1
      - name: Run full-stack smoke tests
        run: node tests/smoke.cjs
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=250
      - name: Shut down test containers
        if: always()
        run: docker compose down -v

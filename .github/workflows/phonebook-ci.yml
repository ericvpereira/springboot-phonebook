name: CI - Phonebook

on:
  push:
    branches: [main, feat/phonebook-web-ui]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run all Java tests and build JAR
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify
      - name: Check frontend JavaScript syntax
        run: node --check src/main/resources/static/assets/phonebook.js
      - name: Validate static frontend contract
        run: node --test tests/frontend.test.cjs
      - name: Upload test reports (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image (tests run in build stage)
        run: docker build -t phonebook:ci .
